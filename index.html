<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050907"><title>NOT Block</title><link rel="stylesheet" href="style.css?v=0.5.2"></head><body><main class="app"><header class="top-hud"><div class="brand"><strong><span>NOT</span> BLOCK</strong><small>PENSE. POSICIONE. EVOLUA.</small></div><div class="hud-cards"><div class="hud-card"><span>♛</span><small>MELHOR</small><b id="bestScore">0</b></div><div class="hud-card"><span class="bars">▂▅▇</span><small>PONTOS</small><b id="score">0</b></div><button class="hud-card settings" id="settingsBtn" aria-label="Configurações">⚙</button></div></header><section class="board-head"><div class="progress"><b>8/8</b><span class="progress-dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div><span>COMPLETE LINHAS,<br>GANHE PONTOS</span></section><section class="game-wrap"><section id="board" class="board" aria-label="Tabuleiro"></section><div id="gameOver" class="game-over" hidden><strong>FIM DE JOGO</strong><span>Nenhuma peça disponível encaixa.</span><button id="restartOver">Jogar novamente</button></div></section><section class="tray" id="tray"></section><section class="future-space" aria-hidden="true"></section><button id="reset" hidden>Reiniciar</button><button id="panelBtn" hidden>Conector</button><span id="panelStatus" hidden>Painel offline</span></main><dialog id="panelModal"><form method="dialog"><h3>Painel universal</h3><p>Digite o código de 8 caracteres gerado pelo Projeto Daniel.</p><input id="panelCode" maxlength="9" autocomplete="off" placeholder="ABCD-EFGH"><button type="button" id="connectPanel">Conectar</button><button>Fechar</button></form></dialog><dialog id="settingsModal"><form method="dialog"><h3>Configurações</h3><button type="button" id="soundSettings">🔊 Som: ligado</button><button type="button" id="testSound">▶ Testar som</button><button type="button" id="restartSettings">Reiniciar partida</button><button type="button" id="connectorSettings">Conector</button><button>Fechar</button></form></dialog><script src="config.js?v=0.5.2"></script><script src="https://cdn.jsdelivr.net/gh/wallissonghost-code/projeto-daniel@14c423787fc4d65fc01cb94c87d47850bc41d5d5/sdk/liveplus-game-sdk-v1.js"></script><script src="src/core/shapes.js?v=0.5.2"></script><script src="src/core/board.js?v=0.5.2"></script><script src="src/core/scoring.js?v=0.5.2"></script><script src="src/features/fake-block.js?v=0.5.2"></script><script src="src/audio/sfx.js?v=0.5.2"></script><script src="src/ui/renderer.js?v=0.5.2"></script><script src="src/input/drag.js?v=0.5.2"></script><script src="game.js?v=0.5.2"></script><script src="live-actions.js?v=0.5.2"></script><script src="panel-bridge.js?v=0.5.2"></script><script>const settingsModal=document.getElementById('settingsModal'),soundBtn=document.getElementById('soundSettings'),testSound=document.getElementById('testSound');function syncSound(){const on=window.NotBlockAudio?.isEnabled()!==false;soundBtn.textContent=on?'🔊 Som: ligado':'🔇 Som: desligado';testSound.disabled=!on}document.getElementById('settingsBtn').onclick=()=>{window.NotBlockAudio?.unlock();syncSound();settingsModal.showModal()};soundBtn.onclick=()=>{window.NotBlockAudio?.toggle();syncSound()};testSound.onclick=()=>{window.NotBlockAudio?.unlock();window.NotBlockAudio?.test()};document.getElementById('restartSettings').onclick=()=>{settingsModal.close();document.getElementById('reset').click()};document.getElementById('connectorSettings').onclick=()=>{settingsModal.close();document.getElementById('panelBtn').click()};syncSound();</script></body></html>
